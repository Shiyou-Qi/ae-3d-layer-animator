<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 图层动画生成器</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lib/jquery.js"></script>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-content">
                <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7L2 17C2 20.314 6.477 23 12 23C17.523 23 22 20.314 22 17V7L12 2Z"></path>
                    <path d="M12 12V23"></path>
                </svg>
                <h1>3D 图层动画生成器</h1>
                <span class="version">v1.0.0</span>
            </div>
        </div>

        <!-- 主容器 -->
        <div class="main-content">

            <!-- 项目信息面板 -->
            <div class="panel">
                <div class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20Z"></path>
                        <polyline points="9 22V12H15V22"></polyline>
                    </svg>
                    <span>项目信息</span>
                </div>
                <div class="panel-content">
                    <div class="info-grid">
                        <div class="info-item">
                            <label>当前合成</label>
                            <span id="compName" class="info-value">--</span>
                        </div>
                        <div class="info-item">
                            <label>合成尺寸</label>
                            <span id="compSize" class="info-value">--</span>
                        </div>
                        <div class="info-item">
                            <label>图层数量</label>
                            <span id="layerCount" class="info-value">0</span>
                        </div>
                        <div class="info-item">
                            <label>合成时长</label>
                            <span id="compDuration" class="info-value">--</span>
                        </div>
                    </div>
                    <button id="refreshBtn" class="btn-refresh">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0114.85-3.36M20.49 15a9 9 0 01-14.85 3.36"></path>
                        </svg>
                        <span>刷新信息</span>
                    </button>
                </div>
            </div>

            <!-- 3D设置参数 -->
            <div class="panel">
                <div class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <path d="M12 1V3"></path>
                        <path d="M12 21V23"></path>
                        <path d="M4.22 4.22L5.64 5.64"></path>
                        <path d="M18.36 18.36L19.78 19.78"></path>
                        <path d="M1 12H3"></path>
                        <path d="M21 12H23"></path>
                        <path d="M4.22 19.78L5.64 18.36"></path>
                        <path d="M18.36 5.64L19.78 4.22"></path>
                    </svg>
                    <span>3D 设置</span>
                </div>
                <div class="panel-content">
                    <!-- 动画时长 -->
                    <div class="form-group">
                        <label for="duration">动画时长</label>
                        <div class="input-row">
                            <input type="number" id="duration" value="5" min="0.5" step="0.5" max="60">
                            <span class="unit">秒</span>
                        </div>
                    </div>

                    <!-- 摄像机距离 -->
                    <div class="form-group">
                        <label for="cameraDistance">摄像机距离</label>
                        <div class="slider-container">
                            <input type="range" id="cameraDistance" min="500" max="3000" step="100" value="1500" class="slider">
                            <div class="slider-values">
                                <span id="cameraDistanceMin">500</span>
                                <span id="cameraDistanceVal" class="slider-value">1500</span>
                                <span id="cameraDistanceMax">3000</span>
                            </div>
                        </div>
                    </div>

                    <!-- 旋转强度 -->
                    <div class="form-group">
                        <label for="rotationIntensity">旋转强度</label>
                        <div class="slider-container">
                            <input type="range" id="rotationIntensity" min="0.5" max="2" step="0.1" value="1" class="slider">
                            <div class="slider-values">
                                <span>0.5x</span>
                                <span id="rotationValue" class="slider-value">1.0x</span>
                                <span>2.0x</span>
                            </div>
                        </div>
                    </div>

                    <!-- X轴旋转 -->
                    <div class="form-group">
                        <label for="rotationX">X轴旋转角度</label>
                        <div class="slider-container">
                            <input type="range" id="rotationX" min="-45" max="45" step="5" value="0" class="slider">
                            <div class="slider-values">
                                <span>-45°</span>
                                <span id="rotationXValue" class="slider-value">0°</span>
                                <span>+45°</span>
                            </div>
                        </div>
                    </div>

                    <!-- Y轴旋转 -->
                    <div class="form-group">
                        <label for="rotationY">Y轴旋转角度</label>
                        <div class="slider-container">
                            <input type="range" id="rotationY" min="-45" max="45" step="5" value="0" class="slider">
                            <div class="slider-values">
                                <span>-45°</span>
                                <span id="rotationYValue" class="slider-value">0°</span>
                                <span>+45°</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 动画类型选择 -->
            <div class="panel">
                <div class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                        <line x1="7" y1="2" x2="7" y2="22"></line>
                        <line x1="12" y1="2" x2="12" y2="22"></line>
                        <line x1="17" y1="2" x2="17" y2="22"></line>
                    </svg>
                    <span>动画类型</span>
                </div>
                <div class="panel-content">
                    <div class="animation-types">
                        <label class="animation-option">
                            <input type="radio" name="animationType" value="rotate" checked>
                            <div class="option-content">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0119.8-4.3M22 12.5a10 10 0 01-19.8 4.2"></path>
                                </svg>
                                <span>旋转</span>
                                <small>Z轴旋转</small>
                            </div>
                        </label>

                        <label class="animation-option">
                            <input type="radio" name="animationType" value="slide">
                            <div class="option-content">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <path d="M9 9l-6 6M15 15l-6 -6"></path>
                                </svg>
                                <span>滑动</span>
                                <small>3D透视</small>
                            </div>
                        </label>

                        <label class="animation-option">
                            <input type="radio" name="animationType" value="zoom">
                            <div class="option-content">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="M21 21l-4.35-4.35"></path>
                                    <line x1="11" y1="8" x2="11" y2="14"></line>
                                    <line x1="8" y1="11" x2="14" y2="11"></line>
                                </svg>
                                <span>缩放</span>
                                <small>Z深度</small>
                            </div>
                        </label>

                        <label class="animation-option">
                            <input type="radio" name="animationType" value="wave">
                            <div class="option-content">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 12h2c1 -2 2 -4 4 -4s3 2 4 4h2c1 -2 2 -4 4 -4s3 2 4 4h2"></path>
                                </svg>
                                <span>波浪</span>
                                <small>层级效果</small>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 图层处理选项 -->
            <div class="panel">
                <div class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7L2 17C2 20.314 6.477 23 12 23C17.523 23 22 20.314 22 17V7L12 2Z"></path>
                        <line x1="12" y1="12" x2="12" y2="23"></line>
                        <polyline points="4 12 12 7 20 12"></polyline>
                    </svg>
                    <span>处理选项</span>
                </div>
                <div class="panel-content">
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" id="enable3D" checked>
                            <span class="checkbox-custom"></span>
                            <span>启用所有图层3D</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="enableDepth" checked>
                            <span class="checkbox-custom"></span>
                            <span>设置图层深度</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="createCamera" checked>
                            <span class="checkbox-custom"></span>
                            <span>创建摄像机</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="createLights">
                            <span class="checkbox-custom"></span>
                            <span>创建灯光</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="addMotionBlur">
                            <span class="checkbox-custom"></span>
                            <span>运动模糊</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="randomOffset">
                            <span class="checkbox-custom"></span>
                            <span>随机延迟</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 缓动函数选择 -->
            <div class="panel">
                <div class="panel-title">
                    <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3v18h18"></path>
                        <path d="M18 5l-5 5-4 -4"></path>
                    </svg>
                    <span>缓动函数</span>
                </div>
                <div class="panel-content">
                    <select id="easeType" class="select-ease">
                        <option value="linear">线性 - 匀速</option>
                        <option value="easeIn">加速 - 慢到快</option>
                        <option value="easeOut">减速 - 快到慢</option>
                        <option value="easeInOut" selected>加减速 - 平滑</option>
                        <option value="easeOutBounce">弹性 - 反弹</option>
                        <option value="easeInCirc">圆形加速</option>
                    </select>
                </div>
            </div>

        </div>

        <!-- 操作按钮 -->
        <div class="button-group">
            <button id="previewBtn" class="btn btn-preview">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span>预览</span>
            </button>
            <button id="applyBtn" class="btn btn-apply">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>应用动画</span>
            </button>
            <button id="resetBtn" class="btn btn-reset">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2-9m-10 7v-5h5"></path>
                </svg>
                <span>重置</span>
            </button>
        </div>

        <!-- 状态栏 -->
        <div id="statusBar" class="status-bar hidden">
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="statusText" class="status-text">处理中...</div>
        </div>

        <!-- 底部提示 -->
        <div class="footer">
            <p>提示: 请确保已选择合成，然后配置参数后点击应用动画</p>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
